<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Golden Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Shield Base -->
  <path d="M 256 64 L 416 112 C 416 280 340 390 256 448 C 172 390 96 280 96 112 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Inner Shield Accent -->
  <path d="M 256 94 L 388 134 C 388 270 326 360 256 410 C 186 360 124 270 124 134 Z" 
        fill="#020617" 
        stroke="#334155" 
        stroke-width="4" 
        opacity="0.9"/>

  <!-- Lightning Bolts / Radio Waves Symbol -->
  <path d="M 230 140 L 290 230 L 250 240 L 300 340 L 210 260 L 250 250 Z" 
        fill="url(#goldGrad)"/>

  <!-- RP Monogram / Typography -->
  <text x="256" y="385" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    RP 3º BPM
  </text>
</svg>
